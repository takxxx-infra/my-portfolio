version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - aws s3 sync content/projects "s3://${SOURCE_BUCKET}/projects/" --delete --exclude "*" --include "*.md" --exclude "*template.md"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
